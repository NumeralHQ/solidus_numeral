name: Release

# Publishes the gem to rubygems.org via RubyGems trusted publishing (OIDC).
# Configure the trusted publisher on rubygems.org for this repository and
# workflow file, then push a `v*` tag matching lib/solidus_numeral/version.rb.
on:
  push:
    tags: ["v*"]

jobs:
  push:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
